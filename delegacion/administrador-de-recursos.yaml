responsabilidades:
  - "mantener el registro de recursos"
  - "mantener conocimiento actualizado sobre los recursos de SC"
  - "registrar nuevos recursos cuando corresponda"
  - "mantener actualizada la información sobre el estado de los recursos"
  - "administrar el uso de los recursos"
  - "procurar el mejor uso posible de los recursos disponibles"
  - "identificar recursos que estén desaprovechados, inutilizados o necesiten atención"
  - "administrar las contribuciones"
  - "evaluar y aceptar o rechazar ofertas de recursos"
  - "mantener registro de las condiciones asociadas a las contribuciones"
  - "asegurar que los recursos sean utilizados de acuerdo con las condiciones bajo las que fueron obtenidos"
  - "resolver cuestiones rutinarias relacionadas con el uso de los recursos"
  - "coordinar la asignación de recursos a iniciativas y otras actividades de SC"
  - "mantener conocimiento sobre los recursos disponibles para futuras iniciativas"
  - "comunicar las necesidades de recursos de SC cuando sea necesario"
  - "coordinar la recepción, transferencia, reutilización y disposición de recursos"
  - "mantener información suficiente para que los recursos puedan ser auditados y localizados"
  - "administrar las ofertas de trabajo y otros recursos humanos como recursos de SC, respetando las condiciones acordadas con quienes los ofrecen"

personas-asignadas:
  - "Santa"

delegaciones: []

detalle: "administra los recursos de SC y las contribuciones relacionadas con ellos. la autoridad sobre iniciativas o actividades concretas no se deriva de administrar sus recursos."
