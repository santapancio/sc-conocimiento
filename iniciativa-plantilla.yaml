detalle: "detalles de la iniciativa"

estado: "propuesto"

estado-detalle: "tenemos otras cosas más importantes a las que darles prioridad"

etiquetas:
  - "software"
  - "servicio"

sub-iniciativas:
  - "[[sub-iniciativa A]]"
  - "[[sub-iniciativa B]]"

# detalle:
# Cualquier cosa relevante, literalmente cualquiera
#
# (FORMATO ESTRICTO) estado:
# Describe el estado actual de la iniciativa
# Lista de estados posibles
#     - propuesto (lo pensamos y lo queremos hacer, pero todavía no sabemos si lo vamos a hacer)
#     - lista de espera (lo vamos a hacer próximamente)
#     - en desarrollo
#     - pausado
#     - abandonado (no se completó y no se está completando)
#     - completado: operando
#     - completado: no operando
#     - completado: descontinuado (se completó y operó, pero ya no lo vamos a operar)
#     - completado (para cosas que se hacen una vez, por ejemplo)
#     - no aplica (de alguna manera, ni idea)
# 
# estado-detalle:
# Campo de formato libre donde se puede aclarar la razón del estado de la iniciativa
#
# (FORMATO ESTRICTO) etiquetas:
# Describen la naturaleza de la iniciativa. No necesitan muchísima precisión, son para hacer más fácil la administración
# Lista de etiquetas
#        - software
#        - producto físico (incluye hardware informático)
#        - servicio
#        - infraestructura
#        - investigación
#        - información
#        - contenido
#        - actividad
#        - trabajo creativo
#        - inversión
#        - operación conjunta (dirigido por múltiples personas / entidades, SC participa)
#        - otro: (especificar)
#
# sub-iniciativas:
# Enumera las sub-iniciativas que pertenecen a esta iniciativa. Deben ser referencias
