responsabilidades:
  - "responsabilidad ejemplo 1"
  - "responsabilidad 2"

personas-asignadas:
  - "persona 1"
  - "persona 2"

subdelegaciones:
  - "[[delegacion 1]]"
  - "[[delegacion 2]]"

detalle: "detalles aaaaaaaaaa"

# responsabilidades:
# Enumera las responsabilidades de esta delegación
#
# personas-asignadas:
# Enumera a las personas asignadas a esta delegación
# La primera persona de esta lista es la persona primaria
#
# delegaciones:
# Enumera las subdelegaciones que pertenecen a esta delegación. Cada item debe contener referencia a la subdelegación en la base de datos
#
# detalle:
# Cualquier cosa relevante, literalmente cualquiera
#
# Estos renglones de comentario (que empiezan con "#") no son necesarios y pueden eliminarse
